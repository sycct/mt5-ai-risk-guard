[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mt5-ai-risk-guard"
version = "0.1.0"
description = "Read-only MT5 MCP risk monitor with deterministic rules and DeepSeek analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openai>=1.40,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13.7,<15",
  "tenacity>=8.2,<10",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
mt5-risk-guard = "risk_guard.main:app"

[tool.hatch.build.targets.wheel]
packages = ["risk_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

